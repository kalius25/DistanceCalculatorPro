name: Performance Regression

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full_benchmark:
        description: Run all predefined benchmark scenarios
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 2 * * 1"

jobs:
  performance-regression:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run smoke benchmark
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.full_benchmark)
        shell: pwsh
        run: |
          python -m app.benchmarks.run_stress --scenario smoke --output artifacts/benchmarks

      - name: Run full benchmark
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_benchmark)
        shell: pwsh
        run: |
          python -m app.benchmarks.run_stress --all --output artifacts/benchmarks

      - name: Run performance gate
        shell: pwsh
        run: |
          python -m app.benchmarks.performance_gate `
            --baseline benchmark-baseline.json `
            --results artifacts/benchmarks/stress-benchmark.json `
            --output artifacts/performance

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-regression-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            artifacts/benchmarks/stress-benchmark.json
            artifacts/benchmarks/stress-benchmark.md
            artifacts/performance/performance-gate.json
            artifacts/performance/performance-gate.md
            benchmark-baseline.json
